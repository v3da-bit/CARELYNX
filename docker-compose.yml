services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carelynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-carelynx}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carelynx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carelynx}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-carelynx}
      CORS_ORIGINS: http://localhost:3000
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-rule_based}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_HARDWARE_LABEL: ${INFERENCE_HARDWARE_LABEL:-local-cpu}
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - docstore:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  docstore:
