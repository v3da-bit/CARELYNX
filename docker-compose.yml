# `docker compose up --build` → web http://localhost:${WEB_PORT:-3000}, API http://localhost:${API_PORT:-8000}/api/v1
# Host ports are overridable (API_PORT / WEB_PORT / POSTGRES_PORT) when the defaults are already in use.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carelynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-carelynx}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carelynx} -d ${POSTGRES_DB:-carelynx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carelynx}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-carelynx}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      STORAGE_LOCAL_DIR: /data/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-rule_based}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://localhost:8080/v1}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_HARDWARE_LABEL: ${INFERENCE_HARDWARE_LABEL:-local-cpu}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
    volumes:
      - docstore:/data/storage
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  docstore:
