# vLLM OpenAI-compatible server on an AMD GPU (ROCm). Linux host with /dev/kfd + /dev/dri required.
#   docker compose -f infra/amd/docker-compose.rocm.yml up -d
# Endpoint: http://localhost:8080/v1  (matches INFERENCE_BASE_URL in .env.example)
services:
  vllm-rocm:
    image: rocm/vllm:latest
    container_name: carelynx-vllm-amd
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 16g
    ports:
      - "8080:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command: >
      vllm serve Qwen/Qwen2.5-7B-Instruct
      --host 0.0.0.0 --port 8000
      --max-model-len 8192
      --gpu-memory-utilization 0.9
